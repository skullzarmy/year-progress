<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Prevent FOUC: resolve theme synchronously before first paint -->
    <script>
      (function() {
        var themes = ['glassmorphism','vaporwave','80s-digital','cyberpunk','terminal'];
        var theme = 'glassmorphism';
        try {
          var params = new URLSearchParams(window.location.search);
          var urlTheme = params.get('theme');
          if (urlTheme && themes.indexOf(urlTheme) !== -1) { theme = urlTheme; }
          else {
            var stored = localStorage.getItem('year_progress_theme');
            if (stored && themes.indexOf(stored) !== -1) { theme = stored; }
          }
        } catch(e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Open Graph -->
    <meta property="og:title" content="Year Progress" />
    <meta property="og:description" content="A beautiful year progress indicator with customizable themes." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://yip.joepeterson.work/og-image.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="681" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://yip.joepeterson.work/og-image.png" />
    <meta name="description" content="A beautiful year progress indicator with customizable themes." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Year In Progress" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Year Progress</title>
    <!-- Fonts: Inter (Standard), Space Mono (Terminal), MS Sans Serif/Tahoma vibe for Vaporwave (Win95), DSEG (80s Digital) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Space+Mono:wght@400;700&display=optional" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Space+Mono:wght@400;700&display=optional"></noscript>
  </head>
  <body>
    <!-- Theme Transition Overlay -->
    <div id="transition-overlay" class="hidden" aria-hidden="true" data-next-theme="">
      <div id="transition-content"></div>
    </div>

    <!-- Background Decorators, simplified for clean CSS hooks -->
    <div id="decorators" aria-hidden="true">
      <div class="theme-layer glass-layer">
        <div class="mesh-gradient"></div>
        <div class="glass-blob blob-1"></div>
        <div class="glass-blob blob-2"></div>
        <div class="glass-blob blob-3"></div>
      </div>
      <div class="theme-layer vapor-layer">
        <div class="vapor-sky"></div>
        <div class="vapor-grid-perspective">
          <div class="vapor-grid"></div>
        </div>
        <!-- Decorative surrealist elements for Vaporwave via CSS -->
        <div class="vapor-window-bg"></div>
      </div>
      <div class="theme-layer cyb-layer">
        <div class="cyb-concrete-bg"></div>
        <div class="cyb-neon-grid"></div>
        <div class="cyb-hologram-ad" aria-hidden="true">ネオン // CYBERNETICS // 電界</div>
        <div class="cyb-scanlines"></div>
      </div>
      <!-- Terminal has no complex background layer -->
    </div>

    <!-- Main App UI -->
    <div id="app">
      <header>
        <div class="theme-picker-container">
          <label for="theme-select" class="visually-hidden">Choose a visual theme</label>
          <select id="theme-select">
            <option value="glassmorphism">glassmorphism</option>
            <option value="vaporwave">vaporwave</option>
            <option value="80s-digital">80s-digital</option>
            <option value="cyberpunk">cyberpunk</option>
            <option value="terminal">terminal</option>
          </select>
        </div>
      </header>

      <main class="progress-main" id="main-ui">
        <div class="card-container">
          <div class="glass-card">
            <!-- Vaporwave Win95 Title Bar (hidden in other themes) -->
            <div class="vapor-titlebar hidden" aria-hidden="true">
              <span class="titlebar-text">YEAR_PROGRESS.EXE</span>
              <div class="titlebar-controls">
                <button class="win95-btn">_</button>
                <button class="win95-btn">□</button>
                <button class="win95-btn">×</button>
              </div>
            </div>
            
            <h1 id="year-title">YEAR PROGRESS</h1>
            
            <div class="progress-wrapper">
              <div class="progress-bar-background" aria-hidden="true">
                <div id="progress-fill" class="progress-bar-fill"></div>
              </div>
              <progress id="semantic-progress" value="0" max="100" class="visually-hidden">0%</progress>
            </div>
            
            <div class="stats" aria-live="polite">
              <div class="percentage-wrapper">
                <span id="term-prefix" class="hidden" aria-hidden="true">&gt; </span>
                <span id="percentage-text" class="percentage">0.000000%</span>
                <span id="term-cursor" class="hidden" aria-hidden="true">_</span>
              </div>
              <div class="details">
                <span id="days-remaining">Calculating...</span>
              </div>
            </div>
          </div>
        </div>
      </main>
      
      <!-- Inline sync calculation to eliminate FCP layout shift (100 Lighthouse) -->
      <script>
        (function() {
          var now = new Date();
          var year = now.getFullYear();
          var startOfYear = new Date(year, 0, 1).getTime();
          var startOfNextYear = new Date(year + 1, 0, 1).getTime();
          var percentage = ((now.getTime() - startOfYear) / (startOfNextYear - startOfYear)) * 100;
          var days = Math.ceil((startOfNextYear - now.getTime()) / (1000 * 60 * 60 * 24));
          var pctStr = percentage.toFixed(7) + '%';
          
          document.getElementById('percentage-text').textContent = pctStr;
          document.getElementById('days-remaining').textContent = days + ' days remaining';
          document.getElementById('semantic-progress').value = percentage;
          document.getElementById('semantic-progress').textContent = pctStr;
          document.getElementById('progress-fill').style.clipPath = 'inset(0 ' + (100 - Math.min(Math.max(percentage, 0), 100)) + '% 0 0)';
        })();
      </script>

      <footer>
        <p id="footer-text">"Lost time is never found again." &mdash; Benjamin Franklin</p>
        <p id="creator-text">
          created by <a href="https://joepeterson.work" target="_blank" rel="noopener noreferrer">Joe Peterson</a>
          | <a href="https://github.com/skullzarmy/year-progress" target="_blank" rel="noopener noreferrer">Source Code</a>
          | <a href="https://unlicense.org" target="_blank" rel="noopener noreferrer">Unlicense (No Rights Reserved)</a>
        </p>
      </footer>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
